{% extends "base.html" %}
{% block title %}Вход в админку{% endblock %}
{% block page_title %}Вход в админку{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="mx-auto w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center mb-4">
                <i data-lucide="shield" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-semibold tracking-tight">Вход в админку</h1>
            <p class="text-zinc-500 mt-2">Введите пароль для доступа</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-zinc-100 p-10">
            <form method="post" action="/admin/auth/login" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-zinc-700 mb-2">Пароль</label>
                    <input type="password" name="password" class="w-full px-5 py-4 rounded-2xl border-2 border-zinc-200 focus:border-blue-500 text-lg" placeholder="••••••••" required>
                </div>

                {% if error %}
                <div class="text-red-600 text-sm bg-red-50 px-4 py-3 rounded-2xl">
                    {{ error }}
                </div>
                {% endif %}

                <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-semibold text-lg transition-all active:scale-[0.985]">
                    Войти
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-zinc-400 mt-8">
            Доступ только для администраторов
        </p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
    });
</script>
{% endblock %}
