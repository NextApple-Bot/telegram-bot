{% extends "base.html" %}
{% block title %}Редактировать товар{% endblock %}
{% block page_title %}Редактировать товар #{{ item.id }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" id="editForm">
            <div class="row g-3">
                <div class="col-md-12"><label class="form-label">Текст товара</label><input type="text" class="form-control" name="text" value="{{ item.text }}" required></div>
                <div class="col-md-6"><label class="form-label">Серийный номер</label><input type="text" class="form-control" name="serial" value="{{ item.serial or '' }}"></div>
                <div class="col-md-6"><label class="form-label">Категория</label><select name="category_id" class="form-select" required>{% for cat in categories %}<option value="{{ cat.id }}" {% if cat.id==item.category_id %}selected{% endif %}>{{ cat.name }}</option>{% endfor %}</select></div>
            </div>
            <hr class="my-4">
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="is_booked" name="is_booked" {% if item.is_booked %}checked{% endif %}><label class="form-check-label fw-semibold">Бронь</label></div>
            <div id="bookingFields" style="display: {% if item.is_booked %}block{% else %}none{% endif %};" class="bg-light p-4 rounded-3 mb-3">
                <h5 class="mb-3">Данные бронирования</h5>
                <div class="row g-3">
                    <div class="col-md-3"><label class="form-label">Стоимость</label><input type="number" step="0.01" class="form-control" name="booking_price" value="{{ item.booking_price or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">П/О</label><input type="number" step="0.01" class="form-control" name="booking_prepayment" value="{{ item.booking_prepayment or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">Способ оплаты</label><select name="booking_payment_type" class="form-select"><option value="">Не указан</option><option value="cash" {% if item.booking_payment_type=='cash' %}selected{% endif %}>Наличные</option><option value="terminal" {% if item.booking_payment_type=='terminal' %}selected{% endif %}>Терминал</option><option value="qr" {% if item.booking_payment_type=='qr' %}selected{% endif %}>QR-код</option><option value="transfer" {% if item.booking_payment_type=='transfer' %}selected{% endif %}>Перевод</option><option value="invoice" {% if item.booking_payment_type=='invoice' %}selected{% endif %}>По счёту</option><option value="installment" {% if item.booking_payment_type=='installment' %}selected{% endif %}>Рассрочка</option></select></div>
                    <div class="col-md-3"><label class="form-label">Площадка</label><input type="text" class="form-control" name="booking_platform" value="{{ item.booking_platform or '' }}"></div>
                    <div class="col-md-4"><label class="form-label">ФИО</label><input type="text" class="form-control" name="booking_full_name" value="{{ item.booking_full_name or '' }}"></div>
                    <div class="col-md-4"><label class="form-label">Телефон</label><input type="tel" class="form-control" name="booking_phone" value="{{ item.booking_phone or '' }}" placeholder="+7XXXXXXXXXX"></div>
                </div>
            </div>
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="is_sold" name="is_sold" {% if item.is_sold %}checked{% endif %}><label class="form-check-label fw-semibold">Продажа</label><small class="text-danger ms-2">(товар удалится)</small></div>
            <div id="saleFields" style="display: {% if item.is_sold %}block{% else %}none{% endif %};" class="bg-light p-4 rounded-3 mb-3">
                <h5 class="mb-3">Данные продажи</h5>
                <div class="row g-3">
                    <div class="col-md-3"><label class="form-label">Стоимость</label><input type="number" step="0.01" class="form-control" name="sale_price" value="{{ item.sale_price or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">П/О</label><input type="number" step="0.01" class="form-control" name="sale_prepayment" value="{{ item.sale_prepayment or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">Оплата</label><input type="number" step="0.01" class="form-control" name="sale_payment_amount" value="{{ item.sale_payment_amount or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">Способ оплаты</label><select name="sale_payment_type" class="form-select"><option value="cash" {% if item.sale_payment_type=='cash' %}selected{% endif %}>Наличные</option><option value="terminal" {% if item.sale_payment_type=='terminal' %}selected{% endif %}>Терминал</option><option value="qr" {% if item.sale_payment_type=='qr' %}selected{% endif %}>QR-код</option><option value="transfer" {% if item.sale_payment_type=='transfer' %}selected{% endif %}>Перевод</option><option value="invoice" {% if item.sale_payment_type=='invoice' %}selected{% endif %}>По счёту</option><option value="installment" {% if item.sale_payment_type=='installment' %}selected{% endif %}>Рассрочка</option><option value="paid" {% if item.sale_payment_type=='paid' %}selected{% endif %}>Оплачен</option></select></div>
                    <div class="col-md-4"><label class="form-label">Площадка</label><input type="text" class="form-control" name="sale_platform" value="{{ item.sale_platform or '' }}"></div>
                    <div class="col-md-4"><label class="form-label">ФИО</label><input type="text" class="form-control" name="sale_full_name" value="{{ item.sale_full_name or '' }}"></div>
                    <div class="col-md-4"><label class="form-label">Телефон</label><input type="tel" class="form-control" name="sale_phone" value="{{ item.sale_phone or '' }}" placeholder="+7XXXXXXXXXX"></div>
                </div>
                <!-- Аксессуары -->
                <div class="mt-4">
                    <h6>Дополнительные товары / аксессуары</h6>
                    <div id="accessories-container"></div>
                    <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="add-accessory-btn"><i class="bi bi-plus-lg"></i> Добавить позицию</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/admin/assortment" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
<script>
    // Та же логика видимости, очистки чисел и аксессуаров, что и ранее (для краткости опущена, но вы можете скопировать из предыдущих полных версий)
    // ...
</script>
{% endblock %}
