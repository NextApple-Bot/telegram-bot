{# Файл: web_admin/templates/assortment_edit_item.html #}
{% extends "base.html" %}
{% block title %}Редактировать товар{% endblock %}
{% block content %}
<h1>Редактировать товар #{{ item.id }}</h1>
<form method="post" id="editForm">
    <div class="mb-3">
        <label for="text" class="form-label">Текст товара</label>
        <input type="text" class="form-control" id="text" name="text" value="{{ item.text }}" required>
    </div>
    <div class="mb-3">
        <label for="serial" class="form-label">Серийный номер</label>
        <input type="text" class="form-control" id="serial" name="serial" value="{{ item.serial or '' }}">
    </div>
    <div class="mb-3">
        <label for="category_id" class="form-label">Категория</label>
        <select name="category_id" id="category_id" class="form-select" required>
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="is_booked" name="is_booked" {% if item.is_booked %}checked{% endif %}>
        <label class="form-check-label" for="is_booked">Бронь</label>
    </div>

    <div id="bookingFields" style="display: {% if item.is_booked %}block{% else %}none{% endif %}; margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
        <h4>Данные бронирования</h4>
        <div class="mb-3">
            <label for="booking_price" class="form-label">Стоимость (₽)</label>
            <input type="number" step="0.01" class="form-control" id="booking_price" name="booking_price" value="{{ item.booking_price or '' }}" oninput="calculateRemainder()">
        </div>
        <div class="mb-3">
            <label for="booking_prepayment" class="form-label">П/О (предоплата, ₽)</label>
            <input type="number" step="0.01" class="form-control" id="booking_prepayment" name="booking_prepayment" value="{{ item.booking_prepayment or '' }}" oninput="calculateRemainder()">
        </div>
        <div class="mb-3">
            <label for="booking_remainder" class="form-label">Остаток (₽)</label>
            <input type="text" class="form-control" id="booking_remainder" readonly>
        </div>
        <div class="mb-3">
            <label for="booking_platform" class="form-label">Площадка</label>
            <input type="text" class="form-control" id="booking_platform" name="booking_platform" value="{{ item.booking_platform or '' }}">
        </div>
        <div class="mb-3">
            <label for="booking_full_name" class="form-label">ФИО</label>
            <input type="text" class="form-control" id="booking_full_name" name="booking_full_name" value="{{ item.booking_full_name or '' }}">
        </div>
        <div class="mb-3">
            <label for="booking_phone" class="form-label">Номер телефона</label>
            <input type="tel" class="form-control" id="booking_phone" name="booking_phone" value="{{ item.booking_phone if item.booking_phone else '+7' }}" pattern="\+7[0-9]{10}" placeholder="+7XXXXXXXXXX">
            <small class="form-text text-muted">Формат: +7XXXXXXXXXX (10 цифр после +7)</small>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/admin/assortment" class="btn btn-secondary">Отмена</a>
</form>

<script>
    const bookingFieldsDiv = document.getElementById('bookingFields');
    const isBookedCheckbox = document.getElementById('is_booked');
    const priceInput = document.getElementById('booking_price');
    const prepayInput = document.getElementById('booking_prepayment');
    const remainderInput = document.getElementById('booking_remainder');

    function calculateRemainder() {
        const price = parseFloat(priceInput.value) || 0;
        const prepay = parseFloat(prepayInput.value) || 0;
        const remainder = price - prepay;
        remainderInput.value = remainder.toFixed(2);
    }

    isBookedCheckbox.addEventListener('change', function() {
        bookingFieldsDiv.style.display = this.checked ? 'block' : 'none';
    });

    calculateRemainder();
</script>
{% endblock %}
