{# Файл: web_admin/templates/assortment_edit_item.html #}
{% extends "base.html" %}
{% block title %}Редактировать товар{% endblock %}
{% block content %}
<h1>Редактировать товар #{{ item.id }}</h1>
<form method="post">
    <div class="mb-3">
        <label for="text" class="form-label">Текст товара</label>
        <input type="text" class="form-control" id="text" name="text" value="{{ item.text }}" required>
    </div>
    <div class="mb-3">
        <label for="serial" class="form-label">Серийный номер</label>
        <input type="text" class="form-control" id="serial" name="serial" value="{{ item.serial or '' }}">
    </div>
    <div class="mb-3">
        <label for="category_id" class="form-label">Категория</label>
        <select name="category_id" id="category_id" class="form-select" required>
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="is_booked" name="is_booked" {% if item.is_booked %}checked{% endif %}>
        <label class="form-check-label" for="is_booked">Бронь</label>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/admin/assortment" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
