{# Файл: web_admin/templates/assortment.html (только модальное окно добавления товара) #}
<!-- Модальное окно добавления товара (полная версия с полями брони) -->
<div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form action="/admin/assortment/add" method="post" onsubmit="return validateAddPhone()">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить товар</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="text" class="form-label">Текст товара</label>
                        <input type="text" class="form-control" id="text" name="text" required>
                    </div>
                    <div class="mb-3">
                        <label for="serial" class="form-label">Серийный номер</label>
                        <input type="text" class="form-control" id="serial" name="serial">
                    </div>
                    <div class="mb-3">
                        <label for="category_id" class="form-label">Категория</label>
                        <select name="category_id" id="category_id" class="form-select" required>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="add_is_booked" name="is_booked">
                        <label class="form-check-label" for="add_is_booked">Бронь</label>
                    </div>
                    <div id="addBookingFields" style="display: none; margin-top: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                        <h5>Данные бронирования</h5>
                        <div class="mb-3">
                            <label for="booking_price" class="form-label">Стоимость (₽)</label>
                            <input type="number" step="0.01" class="form-control" id="booking_price" name="booking_price" oninput="calculateAddRemainder()">
                        </div>
                        <div class="mb-3">
                            <label for="booking_prepayment" class="form-label">П/О (предоплата, ₽)</label>
                            <input type="number" step="0.01" class="form-control" id="booking_prepayment" name="booking_prepayment" oninput="calculateAddRemainder()">
                        </div>
                        <div class="mb-3">
                            <label for="booking_remainder" class="form-label">Остаток (₽)</label>
                            <input type="text" class="form-control" id="booking_remainder" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="booking_platform" class="form-label">Площадка</label>
                            <input type="text" class="form-control" id="booking_platform" name="booking_platform">
                        </div>
                        <div class="mb-3">
                            <label for="booking_full_name" class="form-label">ФИО</label>
                            <input type="text" class="form-control" id="booking_full_name" name="booking_full_name">
                        </div>
                        <div class="mb-3">
                            <label for="booking_phone" class="form-label">Номер телефона</label>
                            <input type="tel" class="form-control" id="booking_phone" name="booking_phone" value="+7" placeholder="+7XXXXXXXXXX" pattern="^\+7\d{10}$" maxlength="12" minlength="12" title="Введите номер в формате +7XXXXXXXXXX (ровно 12 символов)">
                            <small class="form-text text-muted">Формат: +7 и 10 цифр (например, +79991234567)</small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // ... остальные скрипты ...
    // Показывать/скрывать поля брони при добавлении
    const addIsBooked = document.getElementById('add_is_booked');
    const addBookingFields = document.getElementById('addBookingFields');
    if (addIsBooked) {
        addIsBooked.addEventListener('change', function() {
            addBookingFields.style.display = this.checked ? 'block' : 'none';
        });
    }

    function calculateAddRemainder() {
        const price = parseFloat(document.getElementById('booking_price')?.value) || 0;
        const prepay = parseFloat(document.getElementById('booking_prepayment')?.value) || 0;
        const remainderField = document.getElementById('booking_remainder');
        if (remainderField) remainderField.value = (price - prepay).toFixed(2);
    }

    function validateAddPhone() {
        const phoneField = document.getElementById('booking_phone');
        if (phoneField && phoneField.value && phoneField.value.trim() !== '') {
            const phoneRegex = /^\+7\d{10}$/;
            if (!phoneRegex.test(phoneField.value)) {
                alert('Номер телефона должен быть в формате +7XXXXXXXXXX (ровно 12 символов, только цифры после +7)');
                phoneField.focus();
                return false;
            }
        }
        return true;
    }
</script>
