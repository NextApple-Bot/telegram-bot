<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 60px; }
        .navbar { background-color: #343a40; }
        .navbar-brand, .nav-link { color: #fff; }
        .nav-link:hover { color: #ddd; }
        .content { margin-top: 20px; }
        .footer { margin-top: 50px; text-align: center; color: #6c757d; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">Telegram Bot Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Дашборд</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/clients">Клиенты</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/purchases">Покупки</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/assortment">Ассортимент</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/stats">Статистика</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/auth/logout">Выйти</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container content">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <div class="container">
            <p>&copy; 2026 Telegram Bot</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
