<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Telegram Bot Admin{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        :root {
            --primary: #3b82f6;
        }
        * {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .tail-container {
            @apply bg-zinc-50 text-zinc-900;
        }
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        .sidebar-link {
            transition: all 0.2s ease;
        }
        .sidebar-link:hover {
            background-color: #f1f5f9;
            color: #3b82f6;
        }
        .active {
            background-color: #eff6ff;
            color: #3b82f6;
            font-weight: 600;
        }
        .btn {
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="tail-container">
    <div class="flex h-screen">
        <!-- Modern Sidebar -->
        <div class="w-72 bg-white border-r border-zinc-200 flex flex-col shadow-xl">
            <div class="p-6 border-b border-zinc-100 flex items-center gap-3">
                <div class="w-9 h-9 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl">🤖</div>
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">Bot Admin</h1>
                    <p class="text-xs text-zinc-400 -mt-0.5">управление продажами</p>
                </div>
            </div>
            <nav class="flex-1 px-3 py-6 space-y-1">
                <a href="/admin/dashboard" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-3xl text-zinc-700 {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="font-medium">Дашборд</span>
                </a>
                <a href="/admin/assortment" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-3xl text-zinc-700 {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}">
                    <i data-lucide="package" class="w-5 h-5"></i>
                    <span class="font-medium">Ассортимент</span>
                </a>
                <a href="/admin/purchases" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-3xl text-zinc-700 {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span class="font-medium">Покупки</span>
                </a>
                <a href="/admin/clients" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-3xl text-zinc-700 {% if request.url.path.startswith('/admin/clients') %}active{% endif %}">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span class="font-medium">Клиенты</span>
                </a>
                <a href="/admin/sold" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-3xl text-zinc-700 {% if request.url.path.startswith('/admin/sold') %}active{% endif %}">
                    <i data-lucide="bag-check" class="w-5 h-5"></i>
                    <span class="font-medium">Продано</span>
                </a>
                <a href="/admin/stats" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-3xl text-zinc-700 {% if request.url.path.startswith('/admin/stats') %}active{% endif %}">
                    <i data-lucide="trending-up" class="w-5 h-5"></i>
                    <span class="font-medium">Статистика</span>
                </a>
                <a href="/admin/sellers/stats" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-3xl text-zinc-700 {% if request.url.path.startswith('/admin/sellers') %}active{% endif %}">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span class="font-medium">Продавцы</span>
                </a>
            </nav>
            <div class="p-4 border-t border-zinc-100">
                <a href="/admin/auth/logout" class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-3xl transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span class="font-medium">Выйти</span>
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <div class="p-8">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script>
        // Tailwind script init
        function initializeTailwind() {
            tailwind.config = {
                content: [],
                theme: {
                    extend: {}
                }
            }
        }
        initializeTailwind();

        // Lucide icons
        lucide.createIcons();

        // Simple smooth scroll and animations
        console.log('%c🚀 Радикальный редизайн админки загружен!', 'color: #3b82f6; font-size: 14px; font-weight: 600;');
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
