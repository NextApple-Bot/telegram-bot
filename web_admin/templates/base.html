<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <button class="menu-toggle" id="menuToggle" aria-label="Меню">
        <i class="bi bi-list"></i>
    </button>
    <div class="sidebar" id="sidebar">
        <div class="logo">📊 Bot Admin</div>
        <nav>
            <a href="/admin/dashboard" class="nav-link {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> <span>Дашборд</span>
            </a>
            <a href="/admin/clients" class="nav-link {% if request.url.path.startswith('/admin/clients') %}active{% endif %}">
                <i class="bi bi-people"></i> <span>Клиенты</span>
            </a>
            <a href="/admin/purchases" class="nav-link {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}">
                <i class="bi bi-cart-check"></i> <span>Покупки</span>
            </a>
            <a href="/admin/assortment" class="nav-link {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}">
                <i class="bi bi-box-seam"></i> <span>Ассортимент</span>
            </a>
            <a href="/admin/sold" class="nav-link {% if request.url.path.startswith('/admin/sold') %}active{% endif %}">
                <i class="bi bi-bag-check"></i> <span>Продано</span>
            </a>
            <a href="/admin/stats" class="nav-link {% if request.url.path.startswith('/admin/stats') %}active{% endif %}">
                <i class="bi bi-graph-up"></i> <span>Статистика</span>
            </a>
            <a href="/admin/sellers/stats" class="nav-link {% if request.url.path.startswith('/admin/sellers') %}active{% endif %}">
                <i class="bi bi-people-fill"></i> <span>Продавцы</span>
            </a>
            <a href="/admin/auth/logout" class="nav-link">
                <i class="bi bi-box-arrow-right"></i> <span>Выйти</span>
            </a>
        </nav>
    </div>

    <div class="main-content" id="mainContent">
        <div class="top-bar" style="margin-bottom: 2rem;">
            <h1>{% block page_title %}Панель управления{% endblock %}</h1>
        </div>
        <div class="container-fluid px-0">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Мобильное меню (бургер)
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');

        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('mobile-open');
            });
            // Закрытие при клике вне сайдбара
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                    sidebar.classList.remove('mobile-open');
                }
            });
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
