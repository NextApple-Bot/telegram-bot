<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Тёмная тема с градиентами и неоновыми акцентами */
        :root {
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 80px;
            --header-height: 64px;
            --primary: #a78bfa;
            --primary-hover: #8b5cf6;
            --secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0b0e14;
            --light-bg: #0f131a;
            --card-bg: rgba(20, 28, 40, 0.8);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-dark: #e2e8f0;
            --text-muted: #94a3b8;
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
            --radius-md: 1rem;
            --radius-lg: 1.25rem;
            --blur: blur(12px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #1a2330, #0b0e14);
            color: var(--text-dark);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: rgba(15, 23, 36, 0.7);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--card-border);
            transition: width 0.25s ease-in-out;
            z-index: 1040;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
        }
        .sidebar-collapsed { width: var(--sidebar-collapsed-width); }
        .sidebar .logo-area {
            padding: 1.5rem 1.25rem;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 1.5rem;
        }
        .sidebar .logo-area h4 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar-collapsed .logo-area h4 {
            font-size: 1.5rem;
            text-align: center;
        }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.625rem 1.25rem;
            margin: 0.25rem 0.75rem;
            border-radius: var(--radius-md);
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .sidebar .nav-link i {
            font-size: 1.3rem;
            min-width: 24px;
            color: var(--text-muted);
        }
        .sidebar .nav-link:hover {
            background: rgba(167, 139, 250, 0.15);
            color: #c4b5fd;
        }
        .sidebar .nav-link:hover i { color: #a78bfa; }
        .sidebar .nav-link.active {
            background: rgba(139, 92, 246, 0.25);
            color: #c4b5fd;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
        }
        .sidebar .nav-link.active i { color: #a78bfa; }

        .main-content {
            margin-left: var(--sidebar-width);
            transition: margin-left 0.25s ease-in-out;
            padding: 1.5rem 2rem;
        }
        .main-content-expanded { margin-left: var(--sidebar-collapsed-width); }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .top-bar h2 {
            font-size: 1.9rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #e2e8f0, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }
        .theme-toggle {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            padding: 0.5rem;
            border-radius: 9999px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 1.5rem;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--card-border);
            padding: 1.25rem 1.5rem;
            font-weight: 600;
            font-size: 1.1rem;
            color: #e2e8f0;
        }
        .table {
            margin-bottom: 0;
            font-size: 0.9rem;
            color: var(--text-dark);
        }
        .table th {
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
            padding: 0.75rem 1rem;
        }
        .table td {
            padding: 0.75rem 1rem;
            vertical-align: middle;
            border-color: var(--card-border);
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.02);
        }
        .btn {
            border-radius: var(--radius-md);
            padding: 0.5rem 1rem;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(145deg, #8b5cf6, #6366f1);
            border: none;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #7c3aed, #4f46e5);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }
        .btn-outline-primary {
            border: 1px solid #a78bfa;
            color: #a78bfa;
        }
        .btn-outline-primary:hover {
            background: rgba(167, 139, 250, 0.1);
            border-color: #c4b5fd;
            color: #c4b5fd;
        }
        .form-control, .form-select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            color: #e2e8f0;
        }
        .form-control:focus, .form-select:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }
        .pagination .page-link {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-dark);
        }
        .pagination .page-item.active .page-link {
            background: linear-gradient(145deg, #8b5cf6, #6366f1);
            border-color: transparent;
            color: white;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            padding-top: 1.5rem;
        }

        /* Модальные окна */
        .modal-content {
            background: rgba(20, 28, 40, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            color: var(--text-dark);
        }
        .modal-header { border-bottom-color: var(--card-border); }
        .modal-footer { border-top-color: var(--card-border); }

        /* Адаптивность */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.sidebar-mobile-open { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 1rem; }
            .mobile-menu-toggle { display: block; }
            .top-bar h2 { font-size: 1.5rem; }
        }
        @media (min-width: 769px) {
            .sidebar-collapsed .nav-link span { display: none; }
            .sidebar-collapsed .nav-link i { margin: 0 auto; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <h4>📊 Bot Admin</h4>
        </div>
        <div class="nav flex-column">
            <a href="/admin/dashboard" class="nav-link {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> <span>Дашборд</span>
            </a>
            <a href="/admin/clients" class="nav-link {% if request.url.path.startswith('/admin/clients') %}active{% endif %}">
                <i class="bi bi-people"></i> <span>Клиенты</span>
            </a>
            <a href="/admin/purchases" class="nav-link {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}">
                <i class="bi bi-cart-check"></i> <span>Покупки</span>
            </a>
            <a href="/admin/assortment" class="nav-link {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}">
                <i class="bi bi-box-seam"></i> <span>Ассортимент</span>
            </a>
            <a href="/admin/sold" class="nav-link {% if request.url.path.startswith('/admin/sold') %}active{% endif %}">
                <i class="bi bi-bag-check"></i> <span>Продано</span>
            </a>
            <a href="/admin/stats" class="nav-link {% if request.url.path.startswith('/admin/stats') %}active{% endif %}">
                <i class="bi bi-graph-up"></i> <span>Статистика</span>
            </a>
            <a href="/admin/auth/logout" class="nav-link">
                <i class="bi bi-box-arrow-right"></i> <span>Выйти</span>
            </a>
        </div>
        <div class="mt-auto p-3 text-center small text-muted">
            <i class="bi bi-shield-check"></i> v3.0
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="top-bar">
            <div style="display: flex; align-items: center;">
                <button class="mobile-menu-toggle" id="mobileMenuToggle">
                    <i class="bi bi-list"></i>
                </button>
                <h2>{% block page_title %}Панель управления{% endblock %}</h2>
            </div>
            <div>
                <button class="theme-toggle" id="themeToggle" aria-label="Тема">
                    <i class="bi bi-moon-fill"></i>
                </button>
            </div>
        </div>
        <div class="container-fluid px-0">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>© 2026 Telegram Bot Admin — Управление продажами</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Переключение темы (по умолчанию тёмная)
        const themeToggle = document.getElementById('themeToggle');
        function setTheme(theme) {
            // Тема фиксирована тёмная, кнопка не переключает, только иконка
            themeToggle.innerHTML = '<i class="bi bi-moon-fill"></i>';
            localStorage.setItem('admin_theme', 'dark');
        }
        setTheme('dark');
        themeToggle.addEventListener('click', () => {
            // Оставляем тёмную тему, меняем только иконку для эффекта
            themeToggle.innerHTML = '<i class="bi bi-moon-fill"></i>';
        });

        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        let collapsed = false;
        document.querySelector('.logo-area').addEventListener('dblclick', () => {
            collapsed = !collapsed;
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                mainContent.classList.add('main-content-expanded');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                mainContent.classList.remove('main-content-expanded');
            }
        });

        const mobileToggle = document.getElementById('mobileMenuToggle');
        if (mobileToggle) {
            mobileToggle.addEventListener('click', () => {
                sidebar.classList.toggle('sidebar-mobile-open');
            });
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !mobileToggle.contains(e.target)) {
                    sidebar.classList.remove('sidebar-mobile-open');
                }
            });
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
