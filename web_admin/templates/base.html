<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Стили для тёмной темы */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark-mode .navbar {
            background-color: #1f1f1f !important;
        }
        body.dark-mode .card {
            background-color: #1e1e1e;
            border-color: #333;
        }
        body.dark-mode .card-header {
            background-color: #2a2a2a;
            border-bottom-color: #444;
        }
        body.dark-mode .table {
            color: #e0e0e0;
        }
        body.dark-mode .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #2a2a2a;
        }
        body.dark-mode .table-bordered {
            border-color: #444;
        }
        body.dark-mode .table-bordered td, 
        body.dark-mode .table-bordered th {
            border-color: #444;
        }
        body.dark-mode .list-group-item {
            background-color: #1e1e1e;
            border-color: #333;
            color: #e0e0e0;
        }
        body.dark-mode .modal-content {
            background-color: #1e1e1e;
            border-color: #444;
        }
        body.dark-mode .modal-header {
            border-bottom-color: #444;
        }
        body.dark-mode .modal-footer {
            border-top-color: #444;
        }
        body.dark-mode .form-control,
        body.dark-mode .form-select {
            background-color: #2a2a2a;
            border-color: #555;
            color: #e0e0e0;
        }
        body.dark-mode .form-control:focus,
        body.dark-mode .form-select:focus {
            background-color: #2a2a2a;
            color: #e0e0e0;
        }
        body.dark-mode .btn-close {
            filter: invert(1);
        }
        body.dark-mode .footer {
            color: #aaa;
        }
        body.dark-mode .bg-secondary {
            background-color: #333 !important;
        }
        body.dark-mode .accordion-item {
            background-color: #1e1e1e;
            border-color: #444;
        }
        body.dark-mode .accordion-button {
            background-color: #2a2a2a;
            color: #e0e0e0;
        }
        body.dark-mode .accordion-button:not(.collapsed) {
            background-color: #2a2a2a;
            color: #e0e0e0;
        }
        body.dark-mode .accordion-button::after {
            filter: invert(1);
        }
        body.dark-mode .page-link {
            background-color: #2a2a2a;
            border-color: #555;
            color: #e0e0e0;
        }
        body.dark-mode .page-link:hover {
            background-color: #3a3a3a;
            color: #fff;
        }
        body.dark-mode .page-item.active .page-link {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        /* Кнопка переключения темы */
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            margin-left: 15px;
            color: #fff;
        }
        .theme-toggle:focus {
            outline: none;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">Telegram Bot Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Дашборд</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/clients">Клиенты</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/purchases">Покупки</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/assortment">Ассортимент</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/stats">Статистика</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/auth/logout">Выйти</a></li>
                    <li class="nav-item">
                        <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                            🌞
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container content">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <div class="container">
            <p>&copy; 2026 Telegram Bot</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Переключение светлой/тёмной темы
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        // Функция применения темы
        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '🌙';
            } else {
                document.body.classList.remove('dark-mode');
                themeToggle.innerHTML = '🌞';
            }
            localStorage.setItem('admin_theme', theme);
        }

        // Проверка сохранённой темы
        const savedTheme = localStorage.getItem('admin_theme');
        if (savedTheme === 'dark') {
            setTheme('dark');
        } else if (savedTheme === 'light') {
            setTheme('light');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // Если нет сохранённой темы, но система в тёмном режиме
            setTheme('dark');
        } else {
            setTheme('light');
        }

        // Обработчик клика
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.contains('dark-mode');
            if (isDark) {
                setTheme('light');
            } else {
                setTheme('dark');
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
