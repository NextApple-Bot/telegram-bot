<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ----- ПЕРЕМЕННЫЕ ----- */
        :root {
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 80px;
            --header-height: 64px;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --border-light: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== КАСТОМНЫЕ СКРОЛЛБАРЫ ========== */
        /* Для WebKit (Chrome, Safari, Edge) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--border-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        /* Для Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--secondary) var(--border-light);
        }

        /* ========== БОКОВОЕ МЕНЮ ========== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid var(--border-light);
            transition: width 0.25s ease-in-out;
            z-index: 1040;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar .logo-area {
            padding: 1.5rem 1.25rem;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 1.5rem;
        }

        .sidebar .logo-area h4 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.3px;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar-collapsed .logo-area h4 {
            font-size: 1.5rem;
            letter-spacing: -2px;
            text-align: center;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.625rem 1.25rem;
            margin: 0.25rem 0.75rem;
            border-radius: var(--radius-md);
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .sidebar .nav-link i {
            font-size: 1.25rem;
            min-width: 24px;
            color: var(--text-muted);
        }

        .sidebar .nav-link:hover {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .sidebar .nav-link:hover i {
            color: var(--primary);
        }

        .sidebar .nav-link.active {
            background-color: #eef2ff;
            color: var(--primary);
        }

        .sidebar .nav-link.active i {
            color: var(--primary);
        }

        /* ========== ОСНОВНОЙ КОНТЕНТ ========== */
        .main-content {
            margin-left: var(--sidebar-width);
            transition: margin-left 0.25s ease-in-out;
            padding: 1.5rem 2rem;
        }

        .main-content-expanded {
            margin-left: var(--sidebar-collapsed-width);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .top-bar h2 {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0;
            color: var(--dark);
            letter-spacing: -0.02em;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            padding: 0.5rem;
            border-radius: 9999px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background-color: var(--border-light);
            color: var(--primary);
        }

        /* Карточки */
        .card {
            background-color: var(--card-bg);
            border: none;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: transform 0.1s, box-shadow 0.2s;
            margin-bottom: 1.5rem;
        }

        .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--border-light);
            padding: 1rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
        }

        /* Таблицы */
        .table {
            margin-bottom: 0;
            font-size: 0.875rem;
        }

        .table th {
            font-weight: 600;
            color: var(--text-muted);
            border-bottom-width: 1px;
            padding: 0.75rem 1rem;
        }

        .table td {
            padding: 0.75rem 1rem;
            vertical-align: middle;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(0, 0, 0, 0.02);
        }

        /* Кнопки действий (иконки) – улучшенные */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .btn-action i {
            font-size: 1rem;
        }
        .btn-edit {
            background-color: var(--primary);
            color: white;
        }
        .btn-edit:hover {
            background-color: var(--primary-hover);
            color: white;
        }
        .btn-delete {
            background-color: var(--danger);
            color: white;
        }
        .btn-delete:hover {
            background-color: #dc2626;
            color: white;
        }

        /* Анимация загрузки Apple (заполнение яблока) */
        .apple-loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            z-index: 9999;
            display: none;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
        }
        .apple-loader svg {
            width: 60px;
            height: 60px;
            animation: fillApple 1s ease-in-out infinite;
        }
        @keyframes fillApple {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }
        body.loading .apple-loader {
            display: flex;
        }

        /* Тёмная тема для скроллбаров */
        body.dark-mode ::-webkit-scrollbar-track {
            background: #334155;
        }
        body.dark-mode ::-webkit-scrollbar-thumb {
            background: #64748b;
        }
        body.dark-mode ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Остальные стили тёмной темы (из предыдущих версий) */
        body.dark-mode {
            --light-bg: #0f172a;
            --card-bg: #1e293b;
            --border-light: #334155;
            --text-dark: #e2e8f0;
            --text-muted: #94a3b8;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
        }
        body.dark-mode .sidebar .nav-link:hover {
            background-color: #334155;
        }
        body.dark-mode .sidebar .nav-link.active {
            background-color: #1e3a8a;
        }
        body.dark-mode .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.02);
        }
        body.dark-mode .form-control, body.dark-mode .form-select {
            background-color: #0f172a;
            border-color: #334155;
            color: #e2e8f0;
        }
        body.dark-mode .btn-edit {
            background-color: #3b82f6;
        }
        body.dark-mode .btn-delete {
            background-color: #ef4444;
        }
        body.dark-mode .apple-loader {
            background: rgba(30, 41, 59, 0.9);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.sidebar-mobile-open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0 !important;
                padding: 1rem;
            }
            .mobile-menu-toggle {
                display: block;
            }
            .top-bar h2 {
                font-size: 1.5rem;
            }
            .btn-action {
                padding: 0.3rem 0.6rem;
                font-size: 0.7rem;
            }
        }
        @media (min-width: 769px) {
            .mobile-menu-toggle {
                display: none;
            }
            .sidebar-collapsed .nav-link span {
                display: none;
            }
            .sidebar-collapsed .nav-link i {
                margin: 0 auto;
            }
        }

        .mobile-menu-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            margin-right: 1rem;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            padding-top: 1.5rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Боковое меню (без изменений) -->
    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <h4>📊 Bot Admin</h4>
        </div>
        <div class="nav flex-column">
            <a href="/admin/dashboard" class="nav-link {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> <span>Дашборд</span>
            </a>
            <a href="/admin/clients" class="nav-link {% if request.url.path.startswith('/admin/clients') %}active{% endif %}">
                <i class="bi bi-people"></i> <span>Клиенты</span>
            </a>
            <a href="/admin/purchases" class="nav-link {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}">
                <i class="bi bi-cart-check"></i> <span>Покупки</span>
            </a>
            <a href="/admin/assortment" class="nav-link {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}">
                <i class="bi bi-box-seam"></i> <span>Ассортимент</span>
            </a>
            <a href="/admin/stats" class="nav-link {% if request.url.path.startswith('/admin/stats') %}active{% endif %}">
                <i class="bi bi-graph-up"></i> <span>Статистика</span>
            </a>
            <a href="/admin/auth/logout" class="nav-link">
                <i class="bi bi-box-arrow-right"></i> <span>Выйти</span>
            </a>
        </div>
        <div class="mt-auto p-3 text-center small text-muted">
            <i class="bi bi-shield-check"></i> v3.0
        </div>
    </div>

    <!-- Основной контент -->
    <div class="main-content" id="mainContent">
        <div class="top-bar">
            <div style="display: flex; align-items: center;">
                <button class="mobile-menu-toggle" id="mobileMenuToggle">
                    <i class="bi bi-list"></i>
                </button>
                <h2>{% block page_title %}Панель управления{% endblock %}</h2>
            </div>
            <div>
                <button class="theme-toggle" id="themeToggle" aria-label="Тема">
                    <i class="bi bi-sun-fill"></i>
                </button>
            </div>
        </div>

        <div class="container-fluid px-0">
            {% block content %}{% endblock %}
        </div>

        <div class="footer">
            <p>© 2026 Telegram Bot Admin — Управление продажами</p>
        </div>
    </div>

    <!-- Apple Loader (анимация заполнения яблока) -->
    <div class="apple-loader" id="appleLoader">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 90 C25 90 10 70 10 50 C10 30 25 10 50 10 C75 10 90 30 90 50 C90 70 75 90 50 90 Z" fill="none" stroke="var(--primary)" stroke-width="4" stroke-dasharray="200 200" stroke-dashoffset="200" id="applePath">
                <animate attributeName="stroke-dashoffset" from="200" to="0" dur="1s" repeatCount="indefinite" />
            </path>
            <path d="M50 20 L50 80 M30 40 L70 40" stroke="var(--primary)" stroke-width="4" stroke-linecap="round">
                <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
            </path>
        </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Переключение темы
        const themeToggle = document.getElementById('themeToggle');
        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '<i class="bi bi-moon-fill"></i>';
            } else {
                document.body.classList.remove('dark-mode');
                themeToggle.innerHTML = '<i class="bi bi-sun-fill"></i>';
            }
            localStorage.setItem('admin_theme', theme);
        }
        const savedTheme = localStorage.getItem('admin_theme');
        if (savedTheme === 'dark') setTheme('dark');
        else if (savedTheme === 'light') setTheme('light');
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark');
        else setTheme('light');
        themeToggle.addEventListener('click', () => {
            setTheme(document.body.classList.contains('dark-mode') ? 'light' : 'dark');
        });

        // Сворачивание бокового меню двойным кликом на логотипе
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        let collapsed = false;
        document.querySelector('.logo-area').addEventListener('dblclick', () => {
            collapsed = !collapsed;
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                mainContent.classList.add('main-content-expanded');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                mainContent.classList.remove('main-content-expanded');
            }
        });

        // Мобильное меню
        const mobileToggle = document.getElementById('mobileMenuToggle');
        if (mobileToggle) {
            mobileToggle.addEventListener('click', () => {
                sidebar.classList.toggle('sidebar-mobile-open');
            });
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !mobileToggle.contains(e.target)) {
                    sidebar.classList.remove('sidebar-mobile-open');
                }
            });
        }

        // Глобальная функция показа/скрытия анимации загрузки
        window.showAppleLoader = function() {
            document.body.classList.add('loading');
        };
        window.hideAppleLoader = function() {
            document.body.classList.remove('loading');
        };

        // Автоматический показ при отправке любых форм и при AJAX-запросах
        document.addEventListener('submit', function(e) {
            if (e.target.tagName === 'FORM') {
                window.showAppleLoader();
            }
        });
        // Перехват fetch для автоматического скрытия (простой вариант)
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            window.showAppleLoader();
            return originalFetch.apply(this, args).finally(() => {
                window.hideAppleLoader();
            });
        };
        // Для XMLHttpRequest (если используется)
        const originalXHROpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function() {
            window.showAppleLoader();
            this.addEventListener('loadend', () => window.hideAppleLoader());
            return originalXHROpen.apply(this, arguments);
        };
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
