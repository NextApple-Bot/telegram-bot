<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <!-- Предзагрузка шрифта для мгновенного рендера -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 80px;
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-soft: #eff6ff;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-light: #f9fafb;
            --card-bg: #ffffff;
            --border-light: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #334155;  /* улучшен контраст с 64748b на 334155 */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.03), 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -2px rgba(0,0,0,0.03), 0 10px 15px -3px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.03), 0 10px 10px -5px rgba(0,0,0,0.02);
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid var(--border-light);
            transition: width 0.2s ease;
            z-index: 1040;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }
        .sidebar-collapsed { width: var(--sidebar-collapsed-width); }
        .sidebar .logo-area {
            padding: 1.75rem 1.5rem 1.25rem;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 0.5rem;
        }
        .sidebar .logo-area h4 {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.3px;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar-collapsed .logo-area h4 {
            font-size: 1.5rem;
            text-align: center;
            padding: 0;
        }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.625rem 1.25rem;
            margin: 0.25rem 0.75rem;
            border-radius: var(--radius-md);
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .sidebar .nav-link i {
            font-size: 1.2rem;
            min-width: 24px;
            color: var(--text-muted);
        }
        .sidebar .nav-link:hover {
            background-color: var(--primary-soft);
            color: var(--primary);
        }
        .sidebar .nav-link:hover i { color: var(--primary); }
        .sidebar .nav-link.active {
            background-color: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
        }
        .sidebar .nav-link.active i { color: var(--primary); }

        .main-content {
            margin-left: var(--sidebar-width);
            transition: margin-left 0.2s ease;
            padding: 1.75rem 2rem;
        }
        .main-content-expanded { margin-left: var(--sidebar-collapsed-width); }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .top-bar h1, .top-bar h2 {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-dark);
            letter-spacing: -0.02em;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: box-shadow 0.2s;
            margin-bottom: 1.5rem;
        }
        .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--border-light);
            padding: 1rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-dark);
        }

        .table {
            margin-bottom: 0;
            font-size: 0.875rem;
        }
        .table th {
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-light);
            padding: 0.75rem 1rem;
        }
        .table td {
            padding: 0.75rem 1rem;
            vertical-align: middle;
            border-color: var(--border-light);
            word-break: break-word;  /* чтобы серийники не вылезали */
        }
        .table tbody tr:hover {
            background-color: rgba(0,0,0,0.01);
        }

        .btn {
            border-radius: var(--radius-md);
            padding: 0.5rem 1rem;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.15s;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        .btn-primary:hover { background-color: var(--primary-light); border-color: var(--primary-light); }
        .btn-outline-secondary {
            border-color: var(--border-light);
            color: var(--text-dark);
        }
        .btn-outline-secondary:hover {
            background-color: var(--bg-light);
            border-color: var(--secondary);
        }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }

        .form-control, .form-select {
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            background-color: #fff;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .pagination .page-link {
            border-radius: var(--radius-md);
            margin: 0 2px;
            color: var(--text-dark);
            border: 1px solid var(--border-light);
            background: var(--card-bg);
        }
        .pagination .page-item.active .page-link {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .pagination .page-link:hover { background-color: var(--bg-light); }

        .badge {
            font-weight: 500;
            padding: 0.35rem 0.65rem;
            border-radius: 30px;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            padding-top: 1.5rem;
        }

        /* ---- Фокус для доступности ---- */
        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ---- Кнопка мобильного меню (бургер) ---- */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.8rem;
            margin-right: 1rem;
            color: var(--text-dark);
            cursor: pointer;
            z-index: 1100;
        }

        /* ---- Адаптивность ---- */
        @media (max-width: 992px) {
            .sidebar { width: var(--sidebar-collapsed-width); }
            .sidebar .nav-link span { display: none; }
            .sidebar .nav-link i { margin: 0 auto; }
            .sidebar .logo-area h4 { text-align: center; font-size: 1.2rem; }
        }
        @media (max-width: 768px) {
            .mobile-menu-toggle { display: block; }
            .sidebar {
                width: var(--sidebar-width);
                transform: translateX(-100%);
                transition: transform 0.2s ease;
            }
            .sidebar.sidebar-mobile-open { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 1rem; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .top-bar h1 { font-size: 1.5rem; }
            .btn { width: 100%; margin-bottom: 0.5rem; }
            .table { font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .card-body { padding: 1rem; }
            .row { flex-direction: column; }
            .col-md-4, .col-md-3, .col-md-2 { width: 100%; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <h4>📊 Bot Admin</h4>
        </div>
        <div class="nav flex-column">
            <a href="/admin/dashboard" class="nav-link {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> <span>Дашборд</span>
            </a>
            <a href="/admin/clients" class="nav-link {% if request.url.path.startswith('/admin/clients') %}active{% endif %}">
                <i class="bi bi-people"></i> <span>Клиенты</span>
            </a>
            <a href="/admin/purchases" class="nav-link {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}">
                <i class="bi bi-cart-check"></i> <span>Покупки</span>
            </a>
            <a href="/admin/assortment" class="nav-link {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}">
                <i class="bi bi-box-seam"></i> <span>Ассортимент</span>
            </a>
            <a href="/admin/sold" class="nav-link {% if request.url.path.startswith('/admin/sold') %}active{% endif %}">
                <i class="bi bi-bag-check"></i> <span>Продано</span>
            </a>
            <a href="/admin/stats" class="nav-link {% if request.url.path.startswith('/admin/stats') %}active{% endif %}">
                <i class="bi bi-graph-up"></i> <span>Статистика</span>
            </a>
            <a href="/admin/auth/logout" class="nav-link">
                <i class="bi bi-box-arrow-right"></i> <span>Выйти</span>
            </a>
        </div>
        <div class="mt-auto p-3 text-center small text-muted">
            <i class="bi bi-shield-check"></i> v3.0
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="top-bar">
            <div style="display: flex; align-items: center;">
                <button class="mobile-menu-toggle" id="mobileMenuToggle">
                    <i class="bi bi-list"></i>
                </button>
                <h1>{% block page_title %}Панель управления{% endblock %}</h1>
            </div>
            <div></div>
        </div>
        <div class="container-fluid px-0">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>© 2026 Telegram Bot Admin — Управление продажами</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        let collapsed = false;
        document.querySelector('.logo-area').addEventListener('dblclick', () => {
            collapsed = !collapsed;
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                mainContent.classList.add('main-content-expanded');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                mainContent.classList.remove('main-content-expanded');
            }
        });

        const mobileToggle = document.getElementById('mobileMenuToggle');
        if (mobileToggle) {
            mobileToggle.addEventListener('click', () => {
                sidebar.classList.toggle('sidebar-mobile-open');
            });
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !mobileToggle.contains(e.target)) {
                    sidebar.classList.remove('sidebar-mobile-open');
                }
            });
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
