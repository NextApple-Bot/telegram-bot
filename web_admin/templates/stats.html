{% extends "base.html" %}
{% block title %}Статистика{% endblock %}
{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}
{% block content %}
<h1>Статистика за последние {{ days }} дней</h1>
<form method="get" class="mb-3">
    <div class="row">
        <div class="col-auto">
            <select name="days" class="form-select">
                <option value="7" {% if days==7 %}selected{% endif %}>7 дней</option>
                <option value="14" {% if days==14 %}selected{% endif %}>14 дней</option>
                <option value="30" {% if days==30 %}selected{% endif %}>30 дней</option>
                <option value="60" {% if days==60 %}selected{% endif %}>60 дней</option>
                <option value="90" {% if days==90 %}selected{% endif %}>90 дней</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Показать</button>
        </div>
    </div>
</form>

<div class="row">
    <div class="col-md-12">
        <div class="card mb-4">
            <div class="card-header">Количество операций</div>
            <div class="card-body">
                <canvas id="countsChart" width="800" height="400"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">Выручка (₽)</div>
            <div class="card-body">
                <canvas id="revenueChart" width="800" height="400"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const dates = {{ dates|tojson }};
    const salesCounts = {{ sales_counts|tojson }};
    const preCounts = {{ pre_counts|tojson }};
    const bookCounts = {{ book_counts|tojson }};

    const salesRevenue = {{ sales_revenue|tojson }};
    const preRevenue = {{ pre_revenue|tojson }};
    const bookRevenue = {{ book_revenue|tojson }};

    // График количества
    new Chart(document.getElementById('countsChart'), {
        type: 'line',
        data: {
            labels: dates,
            datasets: [
                { label: 'Продажи', data: salesCounts, borderColor: 'blue', backgroundColor: 'rgba(0,0,255,0.1)', fill: true },
                { label: 'Предзаказы', data: preCounts, borderColor: 'green', backgroundColor: 'rgba(0,255,0,0.1)', fill: true },
                { label: 'Брони', data: bookCounts, borderColor: 'orange', backgroundColor: 'rgba(255,165,0,0.1)', fill: true }
            ]
        },
        options: { responsive: true, maintainAspectRatio: true }
    });

    // График выручки
    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: dates,
            datasets: [
                { label: 'Продажи (₽)', data: salesRevenue, borderColor: 'blue', backgroundColor: 'rgba(0,0,255,0.1)', fill: true },
                { label: 'Предзаказы (₽)', data: preRevenue, borderColor: 'green', backgroundColor: 'rgba(0,255,0,0.1)', fill: true },
                { label: 'Брони (₽)', data: bookRevenue, borderColor: 'orange', backgroundColor: 'rgba(255,165,0,0.1)', fill: true }
            ]
        },
        options: { responsive: true, maintainAspectRatio: true }
    });
</script>
{% endblock %}
