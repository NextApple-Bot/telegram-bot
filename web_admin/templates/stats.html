{% extends "base.html" %}
{% block title %}Статистика{% endblock %}
{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}
{% block content %}
<h1>Статистика за последние {{ days }} дней</h1>
<form method="get" class="mb-3">
    <div class="row">
        <div class="col-auto">
            <select name="days" class="form-select">
                <option value="7" {% if days==7 %}selected{% endif %}>7 дней</option>
                <option value="14" {% if days==14 %}selected{% endif %}>14 дней</option>
                <option value="30" {% if days==30 %}selected{% endif %}>30 дней</option>
                <option value="90" {% if days==90 %}selected{% endif %}>90 дней</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Показать</button>
        </div>
    </div>
</form>

<h3>Количество продаж, предзаказов и броней</h3>
<canvas id="countsChart" width="400" height="200"></canvas>

<h3 class="mt-4">Выручка</h3>
<canvas id="revenueChart" width="400" height="200"></canvas>

<script>
    const dates = {{ dates|safe }};
    const salesCounts = {{ sales_counts|safe }};
    const preCounts = {{ pre_counts|safe }};
    const bookCounts = {{ book_counts|safe }};

    const salesRevenue = {{ sales_revenue|safe }};
    const preRevenue = {{ pre_revenue|safe }};
    const bookRevenue = {{ book_revenue|safe }};

    // График количества
    new Chart(document.getElementById('countsChart'), {
        type: 'line',
        data: {
            labels: dates,
            datasets: [
                { label: 'Продажи', data: salesCounts, borderColor: 'blue', fill: false },
                { label: 'Предзаказы', data: preCounts, borderColor: 'green', fill: false },
                { label: 'Брони', data: bookCounts, borderColor: 'orange', fill: false }
            ]
        },
        options: { responsive: true }
    });

    // График выручки
    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: dates,
            datasets: [
                { label: 'Выручка с продаж', data: salesRevenue, borderColor: 'blue', fill: false },
                { label: 'Выручка с предзаказов', data: preRevenue, borderColor: 'green', fill: false },
                { label: 'Выручка с броней', data: bookRevenue, borderColor: 'orange', fill: false }
            ]
        },
        options: { responsive: true }
    });
</script>
{% endblock %}
