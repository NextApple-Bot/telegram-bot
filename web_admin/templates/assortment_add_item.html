{# Файл: web_admin/templates/assortment_add_item.html #}
{% extends "base.html" %}
{% block title %}Добавить товар{% endblock %}
{% block content %}
<h1>Добавить новый товар</h1>
<form method="post">
    <div class="mb-3">
        <label for="text" class="form-label">Текст товара</label>
        <textarea class="form-control" id="text" name="text" rows="3" required placeholder="Например: iPhone 15 Pro 256GB (ABC123)"></textarea>
        <div class="form-text">Серийный номер должен быть в скобках.</div>
    </div>
    <div class="mb-3">
        <label for="serial" class="form-label">Серийный номер (можно оставить пустым)</label>
        <input type="text" class="form-control" id="serial" name="serial">
    </div>
    <div class="mb-3">
        <label for="category_id" class="form-label">Категория</label>
        <select class="form-select" id="category_id" name="category_id" required>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="is_booked" name="is_booked">
        <label class="form-check-label" for="is_booked">Забронировано</label>
    </div>
    <button type="submit" class="btn btn-success">Добавить</button>
    <a href="/admin/assortment" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
