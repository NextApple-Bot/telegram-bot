target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",
    "tests/__pycache__",
]

line-length = 100

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501", "B008", "SIM105", "RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["bot", "web_admin"]
