[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py

# Маркеры для выборочного запуска
markers =
    integration: marks tests as integration (deselect with '-m "not integration"')
    unit: unit tests (fast, no external dependencies)
    slow: slow running tests

# Настройки вывода
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    --cov=bot
    --cov=web_admin
    --cov-report=term-missing
    --cov-report=xml:coverage.xml

# Исключаем папки виртуального окружения
norecursedirs = .git .venv venv env .pytest_cache __pycache__
