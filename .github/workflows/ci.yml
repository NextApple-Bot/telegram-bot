name: CI with auto-fix

on:
  workflow_dispatch:          # Ручной запуск
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write             # Разрешаем пуш исправлений

jobs:
  auto-fix-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff auto-fix
        run: ruff check . --fix

      - name: Commit and push fixes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Автоисправление Ruff"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  lint-and-test:
    needs: auto-fix-lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter (check only)
        run: ruff check . --output-format=github

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_test
          BOT_TOKEN: dummy_token_for_tests
          ADMIN_ID: "1"
          MAIN_GROUP_ID: "1"
          THREAD_SALES: "1"
          THREAD_ASSORTMENT: "2"
          THREAD_ARRIVAL: "3"
          THREAD_PREORDER: "4"
        run: |
          pytest tests/ -v --cov=bot --cov=web_admin --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
