name: CI

on:
  push:
    branches: [ main, develop, refactoring ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Remove uvloop (not needed in CI)
        run: pip uninstall -y uvloop || true

      - name: Run Ruff auto-fix (only on push)
        if: github.event_name == 'push'
        run: ruff check . --fix

      - name: Commit and push auto-fixes
        if: github.event_name == 'push'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --quiet --staged; then
            git commit -m "🤖 Автоисправление Ruff"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Lint with Ruff (check only)
        run: ruff check . --output-format=github

      - name: Run tests
        run: pytest tests/ -v --cov=bot --cov=web_admin --cov-report=xml

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
