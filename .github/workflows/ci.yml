name: CI

on:
  push:
    branches: [ main, develop, refactoring ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Remove uvloop (conflicts with pytest-asyncio in CI)
        run: pip uninstall -y uvloop || true

      - name: Run Ruff auto-fix (only on push)
        if: github.event_name == 'push'
        run: ruff check . --fix

      - name: Commit and push auto-fixes
        if: github.event_name == 'push'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --staged; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Автоисправление Ruff"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Lint with Ruff (check only)
        run: ruff check . --output-format=github

      - name: Security analysis with Bandit
        run: |
          pip install bandit
          bandit -r bot/ web_admin/ -ll --exclude tests/

      - name: Test database migrations
        run: |
          cp alembic.ini.example alembic.ini 2>/dev/null || true
          DB_URL="postgresql://postgres:postgres@localhost:5432/bot_test"
          # Откатываем и накатываем миграции для проверки
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_test

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          BOT_TOKEN: dummy_token
          ADMIN_ID: "123"
          MAIN_GROUP_ID: "-100123"
          THREAD_SALES: "1"
          THREAD_ASSORTMENT: "2"
          THREAD_ARRIVAL: "3"
          THREAD_PREORDER: "4"
          SECRET_KEY: dummy_secret_key_for_testing_only_min_32_chars
          ADMIN_PASSWORD: testpass
          SCALING_ENABLED: "false"
        run: pytest tests/ -v --cov=bot --cov=web_admin --cov-report=xml

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
