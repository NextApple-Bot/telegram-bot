services:
  - type: web
    name: telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MAIN_GROUP_ID
        sync: false
      - key: THREAD_SALES
        sync: false
      - key: THREAD_ASSORTMENT
        sync: false
      - key: THREAD_ARRIVAL
        sync: false
      - key: THREAD_PREORDER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false              # будет получен из созданного Redis инстанса
      - key: PLAN_AMOUNT
        value: 600000
      - key: PORT
        value: 10000
      - key: SCALING_ENABLED
        value: true              # Включаем проверку Redis для масштабирования

  - type: cron
    name: daily-cleanup
    runtime: python
    schedule: "0 3 * * *"        # Каждый день в 03:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cleanup
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
