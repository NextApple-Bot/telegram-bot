services:
  - type: web
    name: telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    preDeployCommand: python run_migrations.py   # Миграции перед деплоем
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MAIN_GROUP_ID
        sync: false
      - key: THREAD_SALES
        sync: false
      - key: THREAD_ASSORTMENT
        sync: false
      - key: THREAD_ARRIVAL
        sync: false
      - key: THREAD_PREORDER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: PLAN_AMOUNT
        value: 600000
      - key: PORT
        value: 10000
      - key: SCALING_ENABLED
        value: true
      - key: DB_POOL_MIN_SIZE
        value: 1
      - key: DB_POOL_MAX_SIZE
        value: 5
      - key: LOG_FORMAT
        value: text
      - key: LOG_TO_FILE
        value: true
      - key: APP_VERSION
        value: 3.1.0

  - type: cron
    name: daily-cleanup
    runtime: python
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cleanup
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
